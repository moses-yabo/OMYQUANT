<!doctype html>
<html lang="en-ZA" data-offline-snapshot="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005039">
  <title>Connection needed | OMYQUANT</title>
  <link rel="stylesheet" href="/offline.css">
  <script src="/offline-client.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--theme-page, #f5f8f4); color: var(--theme-text, #25372d); font-family: system-ui, sans-serif; }
    main { width: min(100%, 28rem); padding: 2rem; border: 1px solid var(--theme-border, #dce5db); border-radius: 16px; background: var(--theme-surface, white); }
    h1 { font-size: 1.5rem; }
    p { line-height: 1.6; }
    a { display: inline-block; padding: .75rem 1rem; border-radius: 8px; background: #005039; color: white; text-decoration: none; }
    a:focus-visible { outline: 3px solid #629c49; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <strong>OMYQUANT</strong>
    <h1>You’re offline</h1>
    <p>Reconnect to load the marketplace, manage your account or submit a request. Orders and bookings need an internet connection.</p>
    <p>If a submission was interrupted, check your account after reconnecting before trying again.</p>
    <button type="button" data-offline-reload>Try again</button>
  </main>
</body>
</html>
